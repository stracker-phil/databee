[package]
name = "databee"
version = "0.1.0"
description = "Minimalistic SQL client"
authors = ["Philipp Stracker <info@philippstracker.com>"]
edition = "2024"


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "databee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.21"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-opener = "2.7.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa"] }
chrono = { version = "0.4.45", features = ["serde"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
futures-util = "0.3.34"
security-framework = "3.7.0"
percent-encoding = "2.3.2"
toml = "1.1.8"
sha2 = "0.11.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
