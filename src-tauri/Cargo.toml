[package]
name = "databee"
version = "0.1.0"
description = "Minimalistic SQL client"
authors = ["Philipp Stracker <info@philippstracker.com>"]
edition = "2024"
license = "MIT"


[lib]
name = "databee_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.21"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.2"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa"] }
chrono = { version = "0.4.45", features = ["serde"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
futures-util = "0.3.34"
security-framework = "3.7.0"
percent-encoding = "2.3.2"
libc = "0.2.190"
toml = "1.1.8"
sha2 = "0.11.1"
zeroize = "1.9.1"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
async-trait = "0.1.92"
ts-rs = { version = "12.0.1", features = ["serde-compat", "chrono-impl", "serde-json-impl", "no-serde-warnings"] }
getrandom = "0.4.3"
regex = "1.13.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-deep-link = "2.6.1"

[features]
# Exposes test doubles (`MemoryStore`) to integration tests.
test-util = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
# Itself with test doubles, so integration tests in tests/ can use them (ADR 0019).
databee = { path = ".", features = ["test-util"] }
tempfile = "3.27.0"
