# What known keys (meta keys and entity columns) mean. First match wins.
# match:     exact key, or a glob with * (e.g. "billing_*")
# group:     display group; unknown keys fall back to prefix grouping
# label:     human label (optional)
# render:    money | time | flag | url | user_agent | email | roles | country | guest_or_user | text
# sensitive: secret (masked until clicked)

# ---------- columns ----------
[[key]]
match = "*_amount"
render = "money"
[[key]]
match = "date_*_gmt"
render = "time"
[[key]]
match = "customer_id"
render = "guest_or_user"
[[key]]
match = "ip_address"
[[key]]
match = "user_agent"
render = "user_agent"
[[key]]
match = "billing_email"
render = "email"
[[key]]
match = "user_email"
render = "email"
[[key]]
match = "user_pass"
sensitive = "secret"
[[key]]
match = "user_activation_key"
sensitive = "secret"
[[key]]
match = "user_registered"
render = "time"
[[key]]
match = "post_date_gmt"
render = "time"
[[key]]
match = "post_modified_gmt"
render = "time"
[[key]]
match = "order_key"
sensitive = "secret"

