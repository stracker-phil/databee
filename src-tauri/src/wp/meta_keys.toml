# How known keys (meta keys and entity columns) render. All matching rules merge; the first to set a property wins.
# match:     exact key, or a glob with * (e.g. "billing_*")
# render:    money | time | flag | url | user_agent | email | roles | country | guest_or_user | text
# sensitive: secret (masked until clicked)

# ---------- columns ----------

[[key]]
match = "*_amount"
render = "money"
[[key]]
match = "date_*_gmt"
render = "time"
[[key]]
match = "customer_id"
render = "guest_or_user"
[[key]]
match = "user_agent"
render = "user_agent"
[[key]]
match = "billing_email"
render = "email"
[[key]]
match = "user_email"
render = "email"
[[key]]
match = "user_pass"
sensitive = "secret"
[[key]]
match = "user_activation_key"
sensitive = "secret"
[[key]]
match = "user_registered"
render = "time"
[[key]]
match = "post_date_gmt"
render = "time"
[[key]]
match = "post_modified_gmt"
render = "time"

# ---------- user profile ----------
[[key]]
match = "order_key"
sensitive = "secret"
[[key]]
match = "*capabilities"
render = "roles"
[[key]]
match = "paying_customer"
render = "flag"
[[key]]
match = "_money_spent"
render = "money"
[[key]]
match = "wc_last_active"
render = "time"
[[key]]
match = "last_update"
render = "time"
[[key]]
match = "session_tokens"
sensitive = "secret"
# ---------- admin UI preferences ----------
[[key]]
match = "rich_editing"
render = "flag"
[[key]]
match = "syntax_highlighting"
render = "flag"
[[key]]
match = "comment_shortcuts"
render = "flag"
[[key]]
match = "use_ssl"
render = "flag"
[[key]]
match = "show_admin_bar_front"
render = "flag"
[[key]]
match = "show_welcome_panel"
render = "flag"
# ---------- addresses ----------
[[key]]
match = "*billing_email"
render = "email"
[[key]]
match = "*billing_country"
render = "country"
[[key]]
match = "*shipping_country"
render = "country"
# ---------- PayPal Payments ----------
[[key]]
match = "PayPal Transaction Fee"
render = "money"
[[key]]
match = "_ppcp_*email"
render = "email"
# ---------- order ----------
[[key]]
match = "_customer_user"
render = "guest_or_user"
[[key]]
match = "_order_total"
render = "money"
[[key]]
match = "_order_key"
sensitive = "secret"
[[key]]
match = "is_vat_exempt"
render = "flag"
[[key]]
match = "_date_paid"
render = "time"
[[key]]
match = "_date_completed"
render = "time"
[[key]]
match = "_paid_date"
render = "time"
[[key]]
match = "_completed_date"
render = "time"
[[key]]
match = "_customer_user_agent"
render = "user_agent"
[[key]]
match = "_wc_order_attribution_session_start_time"
render = "time"
[[key]]
match = "_wc_order_attribution_user_agent"
render = "user_agent"
[[key]]
match = "_wc_order_attribution_session_entry"
render = "url"
[[key]]
match = "_wc_order_attribution_referrer"
render = "url"
[[key]]
match = "_wc_push_notification_*"
