# Built-in plugin registry: how stored keys map to the plugin that owns them.
# Prefixes are matched against the first token of option names, meta keys, hooks,
# log sources and table names (after the WordPress table prefix). Exact matches are `Exact`
# attributions; the lens (P2) adds prefix clustering and value rules on top.

[[plugin]]
slug = "core"
name = "WordPress core"
option_prefixes = ["wp", "widget", "sidebars", "active", "theme", "stylesheet", "template", "blogname", "blogdescription", "siteurl", "home", "admin", "users", "default", "permalink", "page", "posts", "comment", "comments", "cron", "db", "initial", "uninstall", "recently", "upload", "blog", "finished", "fresh", "can", "auto", "html", "links", "mailserver", "medium", "large", "thumbnail", "thumbnails", "image", "timezone", "gmt", "date", "time", "start", "use", "category", "close", "ping", "moderation", "require", "show", "rss", "new", "avatar", "sticky", "https", "WPLANG", "site", "nav", "disallowed"]
meta_prefixes = ["wp", "edit", "thumbnail", "menu", "encoded", "oembed", "session", "nickname", "first", "last", "description", "rich", "syntax", "admin", "use", "show", "locale", "dismissed", "default", "closedpostboxes", "metaboxhidden", "community", "wp_capabilities", "wp_user_level"]
hook_prefixes = ["wp", "do", "delete", "publish", "recovery"]
tables = ["posts", "postmeta", "options", "users", "usermeta", "comments", "commentmeta", "terms", "termmeta", "term_taxonomy", "term_relationships", "links", "blogs", "site", "sitemeta", "signups", "registration_log", "blog_versions", "blogmeta"]

[[plugin]]
slug = "rewrite"
name = "Rewrite rules · core"
option_prefixes = ["rewrite"]

[[plugin]]
slug = "transients"
name = "Transients"
option_prefixes = ["transients"]

[[plugin]]
slug = "woocommerce"
name = "WooCommerce"
option_prefixes = ["woocommerce", "wc", "wcs", "wp_wc"]
meta_prefixes = ["wc", "woocommerce", "billing", "shipping", "customer", "order", "payment", "paying", "last", "wptests", "product", "price", "regular", "sale", "sku", "stock", "manage", "backorders", "sold", "total", "tax", "virtual", "downloadable", "download", "purchase", "featured", "weight", "length", "width", "height", "upsell", "crosssell", "cart", "created", "completed", "paid", "recorded", "prices", "transaction", "new", "date", "edit", "wp"]
hook_prefixes = ["woocommerce", "wc", "wc-admin", "adjust", "generate", "action"]
log_sources = ["wc", "woocommerce", "transactional-emails", "class-wc-payment-gateways", "fatal-errors", "order-notes", "wc-admin"]
tables = ["wc_", "woocommerce_"]

[[plugin]]
slug = "woocommerce-subscriptions"
name = "WooCommerce Subscriptions"
option_prefixes = ["wcs", "woocommerce_subscriptions"]
meta_prefixes = ["subscription", "schedule", "billing_period", "billing_interval", "trial", "requires", "switch", "suspension"]
hook_prefixes = ["woocommerce_scheduled_subscription", "wcs"]
log_sources = ["wcs-functions", "woocommerce-subscriptions-dedicated-queue", "woocommerce-subscriptions-queue-isolator", "wcs-cache", "wcs-switch-cart-items"]
tables = ["wcs_"]

[[plugin]]
slug = "woocommerce-paypal-payments"
