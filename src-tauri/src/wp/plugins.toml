meta_prefixes = ["ppcp", "_ppcp"]
hook_prefixes = ["woocommerce_paypal_payments", "ppcp"]
log_sources = ["woocommerce-paypal-payments", "woocommerce-paypal-agentic"]
tables = ["ppcp_"]

[[plugin]]
slug = "jetpack"
