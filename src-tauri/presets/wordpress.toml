# ---------------------------------------------------------------------------------------------

[[icon]]
table = "*meta"
icon = "menu"

[[icon]]
table = "users"
icon = "user"

[[icon]]
table = "posts"
icon = "file-text"

[[icon]]
table = "comments"
icon = "message-square"

[[icon]]
